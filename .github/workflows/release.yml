name: Create Release
# Push a tag like v1.3.2 -> creates a GitHub Release named 1.3.2
# with RELEASE_NOTES.md as body and apk/BiliTamer-v<ver>.apk attached.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release with APK asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          ASSET="apk/BiliTamer-v${VER}.apk"
          test -f "$ASSET" || { echo "missing $ASSET"; exit 1; }
          gh release create "$GITHUB_REF_NAME" \
            --title "${VER}" \
            --notes-file RELEASE_NOTES.md \
            "$ASSET"
